<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Events</title>
</head>
<body>
    <h1>js dom events</h1>
    <!-- Option 1 for event handler -->
    <button onclick="console.log('78')">click me</button>
    <button onclick="console.log('90')">another button</button>
    <button onclick="console.log('clicked')">another another button</button>
    <br>
    <!-- Option 2 for event handler -->
    <button onclick="makeYellow()">Make Yellow</button>
    <button onclick="makeRed()">Make Red</button>
    <button id="make-blue">Make Blue</button>
    <button id="btn-make-purple">Make Purple</button>
    

    <script src="./js/events.js"></script>
</body>
</html>
